<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0c0a">
<title>Sem conexão · Baraiada Poker Club</title>
<style>
  html, body { margin: 0; min-height: 100%; background: radial-gradient(circle at 15% 0%, rgb(116 38 31 / 18%), transparent 40rem), #0d0c0a; color: #f0e1b5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100vh; display: grid; place-items: center; padding: 20px; box-sizing: border-box; }
  .card { width: 100%; max-width: 380px; text-align: center; border: 1px solid rgb(201 164 90 / 25%); border-radius: 22px; padding: 28px; background: linear-gradient(145deg, rgb(31 23 16 / 96%), rgb(20 15 11 / 98%)); box-sizing: border-box; }
  img { width: 88px; height: 88px; border-radius: 50%; border: 2px solid #c9a45a; object-fit: cover; }
  .kicker { margin: 18px 0 0; font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #c9a45a; }
  h1 { margin: 8px 0 0; font-family: Georgia, "Times New Roman", serif; font-size: 24px; text-transform: uppercase; letter-spacing: .05em; }
  p { color: #c7ae7e; font-size: 14px; line-height: 1.5; }
  button { margin-top: 8px; width: 100%; height: 48px; border: 0; border-radius: 10px; background: #c9a45a; color: #171008; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; cursor: pointer; }
</style>
</head>
<body>
<main><div class="card">
  <img src="/baraiada-logo.jpg" alt="Baraiada Poker Club">
  <p class="kicker">Baraiada Poker Club</p>
  <h1>Sem conexão</h1>
  <p>O app precisa de internet para mostrar o torneio em tempo real. Assim que a conexão voltar, toque em tentar de novo.</p>
  <button onclick="location.reload()">Tentar de novo</button>
</div></main>
<script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
